<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护地球 - 绿色家园</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* 导航栏 */
        header {
            background-color: #2d5a27;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a8e063;
        }

        /* 英雄海报区 */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        /* 核心板块 */
        .container {
            padding: 4rem 10%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card h3 {
            color: #2d5a27;
            margin-bottom: 1rem;
        }

        /* 联系我们 */
        .contact {
            background-color: #e9f5db;
            padding: 4rem 10%;
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 1rem;
            background-color: #2d5a27;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #3e7e37;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 绿色家园</div>
        <nav>
            <a href="#about">关于我们</a>
            <a href="#actions">采取行动</a>
            <a href="#contact">加入我们</a>
        </nav>
    </header>

    <section class="hero">
        <h1>保护环境，从我做起</h1>
        <p>地球不是我们从祖先那里继承的，而是我们从子孙后代那里借来的。</p>
    </section>

    <div class="container" id="actions">
        <div class="section-title">
            <h2>我们能做什么？</h2>
        </div>
        <div class="features">
            <div class="card">
                <h3>减少塑料</h3>
                <p>拒绝使用一次性塑料吸管和购物袋，改用可循环使用的替代品。</p>
            </div>
            <div class="card">
                <h3>节能减排</h3>
                <p>随手关灯，搭乘公共交通，或者选择骑行出行，减少碳足迹。</p>
            </div>
            <div class="card">
                <h3>植树造林</h3>
                <p>参与社区绿化活动，亲手种下一棵树，为大气净化出一份力。</p>
            </div>
        </div>
    </div>

    <section class="contact" id="contact">
        <div class="section-title">
            <h2>加入志愿者行列</h2>
            <p>填写下方表格，了解如何参与我们的环保项目。</p>
        </div>
        <form>
            <input type="text" placeholder="您的姓名" required>
            <input type="email" placeholder="您的邮箱" required>
            <textarea rows="5" placeholder="您的留言..."></textarea>
            <button type="submit">发送申请</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2023 绿色家园环保组织 | 保护自然，守护未来</p>
    </footer>

</body>
</html>
